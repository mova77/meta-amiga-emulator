#
# Machine-readable form of docs/reference/dma-slot-allocation.md. The prose document is
# authoritative and carries the citations, the calibration argument and the divergences;
# this file exists so the allocator (MAE-11) and its tests are DRIVEN by the data rather
# than restating it, and so a divergence found on hardware is a one-line edit here.
#
# CLEAN ROOM: every value below is transcribed from the Amiga Hardware Reference Manual,
# 3rd edition. No emulator source was read. Unverified entries are absent or explicitly
# null — never guessed. See PROVENANCE.md.

meta:
  story: MAE-9
  transcribed: 2026-09-23
  hardware_verified: false          # no measurement has been run against any of this
  document: dma-slot-allocation.md

sources:
  S1: "Amiga Hardware Reference Manual, 3rd ed., ch. 6 Blitter Hardware, Blitter Operations and System DMA"
  S2: "Amiga Hardware Reference Manual, 3rd ed., Figure 6-9: DMA Time Slot Allocation / Horizontal Line"
  S3: "Amiga Hardware Reference Manual, 3rd ed., ch. 3 Playfield Hardware, Telling the System How to Fetch and Display Data"
  S4: "Amiga Hardware Reference Manual, 3rd ed., Figure 6-10: Normal 68000 Cycle"

line:
  # S1 is NTSC throughout and states 227.5 colour clocks, of which it says 226 are
  # allocatable without saying where the remaining 1.5 go. The PAL figure of 227 that
  # specification 3 uses is NOT stated by any source held here.
  colour_clocks_ntsc: 227.5
  allocatable_ntsc: 226
  colour_clocks_pal: null           # UNVERIFIED — not stated in S1..S4
  cycle_ns: 280
  source: S1
  # S1 and S4: the 68000's memory-access half-cycle is the even clock, so every fixed
  # allocation below is odd. This is the invariant to assert in tests.
  cpu_owns_parity: even

# Claimed only when the device is active — S2 footnote: "These operations only take slots
# if the associated operation is being performed."
fixed_allocations:
  refresh:
    count: 4
    slots: [0x01, 0x03, 0x05]
    # S2 draws a fourth refresh cell one cell LEFT of the $00 tick, and disclaims the
    # offset in its own footnote (the chart was "adjusted" so data-fetch start and
    # display start come out right). Its absolute index is not determined by any source.
    unverified_slots: 1
    source: [S1, S2]
  disk:
    count: 3
    slots: [0x07, 0x09, 0x0B]
    source: [S1, S2]
  audio:
    count: 4
    slots_by_channel: { 0: 0x0D, 1: 0x0F, 2: 0x11, 3: 0x13 }
    source: [S1, S2]
  sprite:
    count: 16
    slots_by_sprite:
      0: [0x15, 0x17]
      1: [0x19, 0x1B]
      2: [0x1D, 0x1F]
      3: [0x21, 0x23]
      4: [0x25, 0x27]
      5: [0x29, 0x2B]
      6: [0x2D, 0x2F]
      7: [0x31, 0x33]
    source: [S1, S2]

# Offsets from the first clock of the fetch group, so these are independent of DDFSTRT.
# `null` is a slot no bitplane claims: free for Blitter, Copper and 68000.
bitplane_fetch:
  lores:
    group_clocks: 8
    max_planes: 6
    plane_by_offset: [null, 4, 6, 2, null, 3, 5, 1]
    source: S2
    # Cross-check, both from S1: four planes take offsets 1,3,5,7 -> 4 x 20 words = 80
    # cycles; planes 5 and 6 are the first on even offsets, taking 2 of the 68000's 4
    # per group = "steals 50 percent of the open slots".
  hires:
    group_clocks: 4
    max_planes: 4
    plane_by_offset: [4, 2, 3, 1]
    source: S2
  aga:
    # UNVERIFIED — FMODE and the 8/16-slot fetch modes postdate the 3rd edition; Appendix
    # C covers ECS only. No permitted source held. MAE-11 is OCS/ECS until one is.
    plane_by_offset: null

fetch_window:
  lores: { ddfstrt_normal: 0x38, ddfstop_normal: 0xD0, step_clocks: 8, words_normal: 20 }
  hires: { ddfstrt_normal: 0x3C, ddfstop_normal: 0xD4, step_clocks: 4, words_normal: 40 }
  source: S3
  relations:
    lores: "DDFSTRT = DDFSTOP - 8 * (words - 1)"
    hires: "DDFSTRT = DDFSTOP - 4 * (words - 2)"

limits:
  earliest_fetch: 0x18              # S2: data fetch cannot begin sooner; sprite 0 survives
  hardware_fetch_stop: 0xD8         # S2: prevents overrun into refresh or disk DMA
  display_latency_clocks: 5         # S2: fetch start $38 -> available for display at $45
  source: S2
  # Behaviour for DDFSTRT/DDFSTOP outside these ranges is UNVERIFIED. Specification 4
  # requires following the hardware rather than clamping, so this must be measured before
  # any clamp is written.
  out_of_range_behaviour: null
